<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu-Track -  student Dashboard</title>
    <link rel="stylesheet" href="#">
</head>
<body>
  <header class="navbar">
    <div class="logo">EduTrack</div>
    <nav>
        <a href="index.html" class="active">home</a>
        <a href="#">Subject</a>
        <a href="#">Calculator</a>
        <a href="#">Notes</a>
    </nav>
    <main>
        <!--hero section-->
        <section class="hero">
            <h1>WELCOME , <span id="student-name">student</span>!</h1>
            <p class="subtitle">Track your academic progress in one place</p>
        </section>
        <!--stats card-->>
        <section class="stats-section">
            <div class="container">
                <div class="stats-grid">
                    <div class="stats-card">

                        <div class="stat-number" id="total-subject">4</div>
                        <div class="stat-label">subjects</div>
                        </div>
                    <div class="stat-card">
                      <div class="stat-number" id="average">_</div>
                      <div class="stat-label">Average Grade</div>

                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="gpa">_</div>
                        <div class="stat-label">GPA (out of 4.0)</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="credits">11</div>
                        <div class="stat-label">Total Credits</div>
                    </div>
                </div>
            </div>

        </section>
    </main>
    <footer class="footer">
        <p>&copy; 2026 EduTrack . Level 3 Iganow tech program internship</p>
    </footer>
  </header>
</body>
</html>
