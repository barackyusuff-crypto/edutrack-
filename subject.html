<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">EduTrack</div>
        <nav>
            <a href="index.html">home</a>
            <a href="subject.html" class="active">subject</a>
        <a href="calculator.html">calculator</a>
        <a href="note.html">note</a>
        </nav>
    </header>
    <main>
        <section class="page-header">
            <div class="container">
                <h2>My subjects</h2>
                <button class="btn btn-primary" id="add-btn"> + Add subject</button>
            </div>
        </section>
        <section>
            <!-- search bar-->
             <input type="text" id="search-input" class="search-input" placeholder="search subjects..."/>
             
             <!-- subject cards-->

             <div class="subject-grid" id="subject-container">
                <article class="subject-card">
                    <div class="card-header">
                        <h3>Javascript fundamentals</h3>
                        <span class="badge">SWDJF301</span>
                    </div>
                    <div class="card-body">
                        <div class="grade-badge grade-b">85% - B </div>
                        <p class="credits">Credits : 3</p>
                    </div><br>
                </article>
                <article class="subject-card">
                  <div class="card-header">
                    <h4>Vue j.s framawork</h4>
                    <span class="badge">SWDVF301</span>
                  </div>
                  <div class="card-body">
                    <div class="grade-badge grade-c"> 78% - c</div>
                    <p class="credits">Credits : 3</p>
                  </div><br>
                </article>
                <article class="subject-card">
                  <div class="card-header">
                    <h4>Version control</h4>
                    <span class="badge">SWDVC301</span>
                  </div>
                  <div class="card-body">
                    <div class="grade-badge grade-a"> 92% - A</div>
                    <p class="credits">Credits : 3</p>
                  </div><br>
                </article>
                <article class="subject-card">
                  <div class="card-header">
                    <h4>Website development</h4>
                    <span class="badge">SWDWD301</span>
                  </div>
                  <div class="card-body">
                    <div class="grade-badge grade-b"> 88% - B</div>
                    <p class="credits">Credits : 3</p>
                  </div><br>
                </article>
             </div>

        </section>
    </main>
    
</body>
</html>
